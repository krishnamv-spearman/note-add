name: Update visual baselines

# Manual only: Actions tab -> "Update visual baselines" -> Run workflow, and pick the branch.
# Creates or refreshes the Linux reference images used by tests/e2e/visual.spec.ts and commits
# them back to the chosen branch. Review the images in that commit before merging.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest # same runner as the e2e job in ci.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Regenerate the visual baselines
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots
        env:
          CI: true
      - name: Commit changed Linux baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'tests/e2e/visual.spec.ts-snapshots/*-linux.*'
          if git diff --cached --quiet; then
            echo "No baseline changes; nothing to commit."
          else
            git commit -m "Update Linux visual baselines"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
